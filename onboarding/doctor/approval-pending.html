<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>الطلب قيد المراجعة | Smart Dental Clinic</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../assets/styles.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="../../assets/theme.css" rel="stylesheet" />
</head>
  <body class="bg-light">
    <div class="auth-page d-flex align-items-center min-vh-100 py-5">
      <div class="container">
        <div class="auth-card mx-auto shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white" style="max-width: 650px">
          <div class="auth-form-wrap text-center">
            
            <!-- أيقونة الحالة بتصميم جذاب وخلفية دائرية ناعمة -->
            <div class="mb-4">
              <span class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning rounded-circle" style="width: 80px; height: 80px; font-size: 2rem;">
                <i class="bi bi-hourglass-split"></i>
              </span>
            </div>

            <h1 class="h3 fw-bold mb-3 text-dark">طلبك قيد المراجعة</h1>
            <p class="text-muted lh-lg mb-4">
              تم إرسال الطلب بنجاح. يبقى حساب الطبيب في حالة انتظار، ولا تفتح
              الواجهة الطبية الكاملة حتى تتم الموافقة على إنشاء العيادة أو قبول
              طلب الوظيفة.
            </p>

            <!-- صندوق تفاصيل الحالة -->
            <div class="alert alert-light border border-secondary-subtle rounded-4 text-start p-3 mb-4 shadow-none">
              <div class="d-flex align-items-center">
                <i class="bi bi-info-circle-fill text-primary ms-2 fs-5"></i>
                <div>
                  <span class="text-muted small d-block">حالة الحساب الحالية:</span>
                  <strong class="text-dark">بانتظار الموافقة والتحقق</strong>
                </div>
              </div>
            </div>

            <!-- أزرار الإجراءات بترتيب ونظام أفضل -->
            <div class="d-grid gap-2">
              <a class="btn btn-primary btn-lg py-2" href="../../auth/login.html">
                <i class="bi bi-box-arrow-right ms-1"></i> العودة لتسجيل الدخول
              </a>
              
              <div class="row g-2 mt-1">
                <div class="col-sm-6">
                  <a class="btn btn-outline-warning w-100 py-2" href="clinic/application-status.html">
                    <i class="bi bi-file-earmark-text ms-1"></i> طلب يحتاج استكمال
                  </a>
                </div>
                <div class="col-sm-6">
                  <a class="btn btn-outline-primary w-100 py-2" href="jobs/application-status.html">
                    <i class="bi bi-briefcase ms-1"></i> حالة طلب وظيفة
                  </a>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/app.js"></script>
  <script src="../../assets/ux.js" defer></script>
</body>
</html>
